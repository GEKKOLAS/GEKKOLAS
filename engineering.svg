 <text x="406" y="157" fill="#F9F8FF" font-family="Arial,sans-serif" font-size="23" font-weight="bold">DOMAIN-DRIVEN DESIGN</text>
 <text x="406" y="199" fill="#B2BBD7" font-family="Arial,sans-serif" font-size="21">Business-first models,</text>
 <text x="406" y="228" fill="#B2BBD7" font-family="Arial,sans-serif" font-size="21">explicit domain rules.</text><rect x="740" y="40" width="335" height="225" rx="19" fill="#1D2142" stroke="#5C528B" stroke-width="2"/>
