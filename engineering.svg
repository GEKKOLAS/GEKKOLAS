 <text x="51" y="199" fill="#B2BBD7" font-family="Arial,sans-serif" font-size="21">Boundaries, maintainability</text>
 <text x="51" y="228" fill="#B2BBD7" font-family="Arial,sans-serif" font-size="21">and testable code.</text><rect x="385" y="40" width="335" height="225" rx="19" fill="#1D2142" stroke="#5C528B" stroke-width="2"/>
